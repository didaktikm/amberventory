# AmberVentory: Docker Compose.
# Подготовка: cp .env.example .env && chmod 600 .env, затем задайте AMBER_PASSWORD в .env.
# Запуск готового образа: docker compose up -d
# Сборка из исходников:   docker compose up -d --build
services:
  amberventory:
    image: ghcr.io/didaktikm/amberventory:${AMBERVENTORY_VERSION:-latest}
    build: .
    container_name: amberventory
    restart: unless-stopped
    # Сеть хоста: nmap видит локальную сеть без NAT. Недоступна в Docker Desktop (macOS, Windows).
    # Для bridge-сети удалите network_mode, раскомментируйте `ports` и `environment` ниже:
    # сервис должен слушать все интерфейсы контейнера, иначе публикация порта до него не дойдёт.
    network_mode: host
    # ports:
    #   - "127.0.0.1:8080:8080"
    env_file: .env
    # environment:
    #   AMBER_HOST: "0.0.0.0"   # переопределяет AMBER_HOST из .env
    volumes:
      - data:/data
      # Закреплённые ключи хостов для режима «Проверять host key»:
      # - ./known_hosts:/home/amber/.ssh/known_hosts:ro

volumes:
  data:
    # Явное имя: совпадает с томом из `docker run` в README и не зависит от имени каталога проекта.
    name: amberventory-data
