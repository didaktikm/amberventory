name: Publish

# main  -> image ghcr.io/<owner>/amberventory:edge and :sha-<commit>
# vX.Y.Z -> image :X.Y.Z, :X.Y, :latest, Helm chart oci://ghcr.io/<owner>/charts/amberventory:X.Y.Z, GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push the image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` only for release tags (the default for flavor.latest=auto with semver tags)
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=AmberVentory
            org.opencontainers.image.description=Debian fleet inventory and vulnerability report
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Informational: the product is a vulnerability scanner, so scan its own image too.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the scan to code scanning
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true # requires code scanning to be available for the repository
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  chart:
    name: Package and push the Helm chart
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Package
        run: |
          helm package deploy/helm/amberventory \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination dist

      - name: Push to ghcr.io
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/amberventory-${{ steps.ver.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AmberVentory ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease[@]}" \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`
          Chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/amberventory --version ${GITHUB_REF_NAME#v}\`"
