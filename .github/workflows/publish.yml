name: Publish

# main  -> image ghcr.io/<owner>/amberventory:edge and :sha-<commit>
# vX.Y.Z -> image :X.Y.Z, :X.Y, :latest, Helm chart oci://ghcr.io/<owner>/charts/amberventory:X.Y.Z, GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push the image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # `latest` only for release tags (the default for flavor.latest=auto with semver tags)
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=AmberVentory
            org.opencontainers.image.description=Debian fleet inventory and vulnerability report
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GHCR creates container packages as private, and GITHUB_TOKEN cannot change their visibility.
  # Set the repository secret PACKAGES_TOKEN (classic PAT with write:packages, or fine-grained with
  # Packages: read and write) to make the image public on every publish. Without it, this job is skipped.
  make-public:
    name: Make the image public
    needs: image
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility to public
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: amberventory
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "::notice::PACKAGES_TOKEN is not set; skipping. Make the package public once in GitHub UI or add the secret."
            exit 0
          fi
          if [[ "${OWNER_TYPE}" == "Organization" ]]; then base="orgs/${OWNER}"; else base="user"; fi
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/${base}/packages/container/${PACKAGE}/visibility" \
            -d '{"visibility":"public"}')"
          echo "HTTP ${code}"
          if [[ "${code}" != "204" ]]; then cat /tmp/resp.json; exit 1; fi

  chart:
    name: Package and push the Helm chart
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Package
        run: |
          helm package deploy/helm/amberventory \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination dist

      - name: Push to ghcr.io
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/amberventory-${{ steps.ver.outputs.version }}.tgz" "oci://ghcr.io/${owner}/charts"

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AmberVentory ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${prerelease[@]}" \
            --notes "Image: \`${IMAGE}:${GITHUB_REF_NAME#v}\`
          Chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/amberventory --version ${GITHUB_REF_NAME#v}\`"
