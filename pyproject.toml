[project]
name = "amberventory"
version = "0.1.0"
description = "Debian fleet inventory and vulnerability report (Ansible, nmap, Debian Security Tracker, CISA KEV, EPSS)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ansible/callback_plugins"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines in data tables and regexes are fine
    "B008",   # FastAPI uses File(...)/Form(...) as defaults
    "UP037",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
