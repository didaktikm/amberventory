{{- if include "amberventory.createSecret" . }}
{{- /*
  Credentials. A random password is generated on first install and reused on upgrades by looking up
  the existing Secret. `lookup` returns nothing under `helm template` or in GitOps renderers,
  so set auth.password or auth.existingSecret there.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "amberventory.fullname" .)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "amberventory.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amberventory.labels" . | nindent 4 }}
  {{- with (include "amberventory.mergedAnnotations" (list . dict) | fromYaml) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
  username: {{ .Values.auth.username | b64enc | quote }}
  password: {{ .Values.auth.password | b64enc | default (get $existing "password") | default (randAlphaNum 24 | b64enc) | quote }}
  {{- end }}
  {{- if and .Values.nvd.apiKey (not .Values.nvd.existingSecret) }}
  api-key: {{ .Values.nvd.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
