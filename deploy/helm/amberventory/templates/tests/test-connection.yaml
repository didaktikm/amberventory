apiVersion: v1
kind: Pod
metadata:
  name: {{ include "amberventory.fullname" . }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "amberventory.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  automountServiceAccountToken: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: healthz
      image: {{ include "amberventory.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image ships Python but no curl/wget.
      command:
        - python
        - -c
        - |
          import sys, urllib.request
          url = "http://{{ include "amberventory.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}/healthz"
          with urllib.request.urlopen(url, timeout=10) as r:
              body = r.read().decode()
              print(r.status, body)
              sys.exit(0 if r.status == 200 and '"ok"' in body else 1)
