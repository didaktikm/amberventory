apiVersion: v2
name: amberventory
description: Инвентаризация парка Debian и оценка уязвимостей (Ansible, nmap, Debian Security Tracker, CISA KEV, EPSS) с веб-интерфейсом
type: application
# Версия чарта. При релизе workflow публикации подставляет версию из git-тега.
version: 0.1.0
# Версия приложения; по умолчанию также тег образа. При релизе берётся из git-тега.
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/didaktikm/amberventory
sources:
  - https://github.com/didaktikm/amberventory
keywords:
  - inventory
  - debian
  - ansible
  - vulnerability
  - security
  - cve
  - devops
maintainers:
  - name: Amber Data, отдел DevOps
    url: https://github.com/didaktikm/amberventory
icon: https://raw.githubusercontent.com/didaktikm/amberventory/main/docs/assets/logo-mark.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: amberventory
      image: ghcr.io/didaktikm/amberventory:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64
