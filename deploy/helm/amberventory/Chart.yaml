apiVersion: v2
name: amberventory
description: Debian fleet inventory and vulnerability report (Ansible, nmap, Debian Security Tracker, CISA KEV, EPSS) with a web UI
type: application
# Chart version: bumped by the release workflow from the git tag.
version: 0.1.0
# Application version: also the default image tag.
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/didaktikm/amberventory
sources:
  - https://github.com/didaktikm/amberventory
keywords:
  - inventory
  - debian
  - ansible
  - vulnerability
  - security
  - cve
  - devops
maintainers:
  - name: didaktikm
    url: https://github.com/didaktikm
icon: https://raw.githubusercontent.com/didaktikm/amberventory/main/docs/assets/logo-mark.svg
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: security
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: amberventory
      image: ghcr.io/didaktikm/amberventory:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64
