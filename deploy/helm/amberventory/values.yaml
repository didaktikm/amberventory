# Значения по умолчанию для чарта amberventory.
# Комментарии, начинающиеся с "# --", helm-docs переносит в README.md.

# -- Заменяет имя чарта в именах ресурсов
nameOverride: ""
# -- Заменяет полное имя ресурсов
fullnameOverride: ""
# -- Метки для всех ресурсов
commonLabels: {}
# -- Аннотации для всех ресурсов
commonAnnotations: {}

image:
  # -- Репозиторий образа
  repository: ghcr.io/didaktikm/amberventory
  # -- Тег образа. По умолчанию `appVersion` чарта
  tag: ""
  # -- Digest образа (`sha256:...`). Если задан, используется вместо `tag`
  digest: ""
  # -- Политика загрузки образа
  pullPolicy: IfNotPresent

# -- Секреты для загрузки образа из приватного реестра. Новый пакет в GitHub Container Registry приватный, пока его видимость не изменена
imagePullSecrets: []

# Аутентификация. Сервис хранит SSH-ключ с доступом ко всем хостам,
# поэтому по умолчанию чарт включает аутентификацию.
auth:
  # -- Включить HTTP basic auth (`/healthz` остаётся открытым для проб)
  enabled: true
  # -- Имя пользователя. Не используется, если задан `existingSecret`
  username: admin
  # -- Пароль. Если пусто, при первой установке генерируется случайный и сохраняется при обновлениях
  # (только для `helm install/upgrade`; для `helm template` и GitOps задайте значение или `existingSecret`)
  password: ""
  # -- Имя существующего Secret с учётными данными
  existingSecret: ""
  # -- Ключ с именем пользователя в `existingSecret`
  existingSecretUserKey: username
  # -- Ключ с паролем в `existingSecret`
  existingSecretPasswordKey: password

nvd:
  # -- Ключ API NVD. Необязательный: ускоряет загрузку CVSS примерно в десять раз
  apiKey: ""
  # -- Имя существующего Secret с ключом API NVD
  existingSecret: ""
  # -- Ключ с ключом API в `existingSecret`
  existingSecretKey: api-key

# Настройки сервиса; передаются в переменные окружения AMBER_*.
config:
  # -- Порт, на котором слушает сервис
  port: 8080
  # -- Число параллельных SSH-сессий (`AMBER_FORKS`). Каждая сессия — отдельный процесс Python (оценка: 50–80 MiB), согласуйте с лимитом памяти
  forks: 10
  # -- Таймаут SSH-подключения, с (`AMBER_SSH_TIMEOUT`)
  sshTimeout: 15
  # -- Максимальная длительность одного сбора, с (`AMBER_JOB_TIMEOUT`)
  jobTimeout: 1800
  # -- Максимум адресов в одном запросе на сканирование (`AMBER_MAX_SCAN_HOSTS`)
  maxScanHosts: 4096
  # -- Интервал обновления баз уязвимостей, с (`AMBER_FEED_TTL`)
  feedTtl: 21600
  # -- Максимум CVE, запрашиваемых в NVD за один запуск (`AMBER_NVD_MAX`)
  nvdMaxPerRun: 300
  # -- Список наблюдения: исходные пакеты Debian, glob через запятую (`AMBER_WATCHLIST`). Пусто — встроенный список
  watchlist: ""
  # -- Зеркало JSON Debian Security Tracker (`AMBER_TRACKER_URL`)
  trackerUrl: ""
  # -- Зеркало каталога CISA KEV (`AMBER_KEV_URL`)
  kevUrl: ""
  # -- Зеркала файла EPSS через запятую (`AMBER_EPSS_URL`)
  epssUrl: ""

proxy:
  # -- `HTTP_PROXY` для загрузки баз уязвимостей. Учётные данные прокси передавайте через `extraEnvFrom` из Secret, не здесь
  http: ""
  # -- `HTTPS_PROXY` для загрузки баз уязвимостей
  https: ""
  # -- `NO_PROXY`
  noProxy: ""

# -- Дополнительные переменные окружения (список `EnvVar`)
extraEnv: []
# -- Дополнительные источники `envFrom` (ConfigMap или Secret)
extraEnvFrom: []

# -- Содержимое `known_hosts`, монтируется в `~/.ssh/known_hosts`. Нужно для режима «Проверять host key»
knownHosts: ""

serviceAccount:
  # -- Создать ServiceAccount
  create: true
  # -- Имя ServiceAccount. Если пусто, формируется из имени релиза
  name: ""
  # -- Аннотации ServiceAccount
  annotations: {}
  # -- Монтировать токен ServiceAccount. Сервис не обращается к Kubernetes API
  automount: false

# -- Аннотации пода
podAnnotations: {}
# -- Метки пода
podLabels: {}

# -- Контекст безопасности пода. UID/GID 10001 — пользователь `amber` из образа
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# -- Контекст безопасности контейнера. Каталоги для записи (`/data`, `/tmp`, `/home/amber`) смонтированы как тома
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Запускать под в сети узла. Нужно, если подсеть доступна с узлов, но не из сети подов
hostNetwork: false
# -- Политика DNS. При `hostNetwork: true` и пустом значении используется `ClusterFirstWithHostNet`
dnsPolicy: ""

service:
  # -- Тип Service
  type: ClusterIP
  # -- Порт Service
  port: 80
  # -- Порт узла для `type: NodePort`
  nodePort: null
  # -- Аннотации Service
  annotations: {}

ingress:
  # -- Создать Ingress
  enabled: false
  # -- Имя IngressClass
  className: ""
  # -- Аннотации Ingress. Для ручной загрузки JSON трекера Debian (около 60 МБ) увеличьте лимит тела запроса, например `nginx.ingress.kubernetes.io/proxy-body-size: 128m`
  annotations: {}
  # -- Хосты и пути Ingress
  hosts:
    - host: amberventory.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Настройки TLS для Ingress
  tls: []

httpRoute:
  # -- Создать HTTPRoute (Gateway API)
  enabled: false
  # -- Аннотации HTTPRoute
  annotations: {}
  # -- Gateway, к которым подключается маршрут
  parentRefs: []
  # -- Имена хостов маршрута
  hostnames: []
  # -- Правила маршрута. По умолчанию `/` направляется в Service
  rules: []

persistence:
  # -- Хранить `/data` (SSH-ключ, отчёты, базы уязвимостей) на постоянном томе. Если выключено, используется `emptyDir` и данные теряются при перезапуске
  enabled: true
  # -- Использовать существующий PersistentVolumeClaim
  existingClaim: ""
  # -- StorageClass. `-` отключает динамическое выделение, пусто — класс кластера по умолчанию
  storageClass: ""
  # -- Режимы доступа. Сервис работает в одной реплике, `ReadWriteOnce` достаточно
  accessModes:
    - ReadWriteOnce
  # -- Размер тома
  size: 5Gi
  # -- Аннотации PVC. `helm.sh/resource-policy: keep` сохраняет том после `helm uninstall`
  annotations: {}

# -- Запросы и лимиты ресурсов. Это оценки, а не замеры: память растёт с `config.forks` и размером парка
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

startupProbe:
  # -- Включить startup-пробу
  enabled: true
  httpGet:
    # -- HTTP-путь startup-пробы
    path: /healthz
    # -- Порт startup-пробы (имя порта контейнера)
    port: http
  # -- Период startup-пробы, с
  periodSeconds: 5
  # -- Число неудачных проверок до перезапуска контейнера
  failureThreshold: 30
livenessProbe:
  # -- Включить liveness-пробу
  enabled: true
  httpGet:
    # -- HTTP-путь liveness-пробы
    path: /healthz
    # -- Порт liveness-пробы (имя порта контейнера)
    port: http
  # -- Период liveness-пробы, с
  periodSeconds: 20
  # -- Таймаут liveness-пробы, с
  timeoutSeconds: 5
  # -- Число неудачных проверок до перезапуска контейнера
  failureThreshold: 3
readinessProbe:
  # -- Включить readiness-пробу
  enabled: true
  httpGet:
    # -- HTTP-путь readiness-пробы
    path: /healthz
    # -- Порт readiness-пробы (имя порта контейнера)
    port: http
  # -- Период readiness-пробы, с
  periodSeconds: 10
  # -- Таймаут readiness-пробы, с
  timeoutSeconds: 5
  # -- Число неудачных проверок до исключения пода из Service
  failureThreshold: 3

networkPolicy:
  # -- Создать NetworkPolicy
  enabled: false
  # -- Источники, которым разрешён доступ к сервису (список NetworkPolicyPeer). Пусто — разрешены все
  ingressFrom: []
  egress:
    # -- Разрешить DNS-запросы (порт 53 TCP/UDP) к любым адресам
    dns: true
    # -- TCP-порты, разрешённые к любым адресам: SSH к хостам, HTTPS к источникам баз уязвимостей. Добавьте нестандартные SSH-порты
    ports:
      - 22
      - 443
    # -- Дополнительные правила исходящего трафика (список NetworkPolicyEgressRule)
    extraRules: []

# -- Дополнительные тома
extraVolumes: []
# -- Дополнительные точки монтирования в контейнере
extraVolumeMounts: []

# -- Время на корректное завершение пода, с
terminationGracePeriodSeconds: 30
# -- Имя PriorityClass
priorityClassName: ""
# -- Селектор узлов
nodeSelector: {}
# -- Tolerations
tolerations: []
# -- Правила affinity
affinity: {}
