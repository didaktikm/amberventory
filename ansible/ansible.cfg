[defaults]
callback_plugins = ./callback_plugins
callbacks_enabled = amber
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 15
forks = 25
nocows = 1
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa
pipelining = True
